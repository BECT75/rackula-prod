name: Mobile Side View Public Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-side-view-test.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rackula-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build production root and isolated test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      prod_short: ${{ steps.prod_source.outputs.short }}
      test_short: ${{ steps.test_source.outputs.short }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          repository: BECT75/rackula
          ref: edd9bf832d2f6e3058a7c750818f155298a6e2d6
          path: prod
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout corrected test source
        uses: actions/checkout@v4
        with:
          repository: BECT75/rackula
          ref: 36493fcae1d4fbfe807a393b9e6363ad9393c3d6
          path: test
          fetch-depth: 1
          persist-credentials: false

      - name: Assert production source identity
        id: prod_source
        working-directory: prod
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "edd9bf832d2f6e3058a7c750818f155298a6e2d6"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assert test source identity
        id: test_source
        working-directory: test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "36493fcae1d4fbfe807a393b9e6363ad9393c3d6"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            prod/package-lock.json
            test/package-lock.json

      - name: Build immutable production root
        working-directory: prod
        env:
          VITE_ENV: production
          VITE_BASE_PATH: /rackula-prod/
        run: |
          npm ci
          npm run build

      - name: Adapt production static root references
        working-directory: prod
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const files = ['dist/index.html', 'dist/login.html'];
          const refs = ['/favicon.png', '/favicon-light.png', '/favicon.ico', '/apple-touch-icon.png', '/config.js'];
          for (const file of files) {
            let html = fs.readFileSync(file, 'utf8');
            for (const ref of refs) html = html.split(`\"${ref}\"`).join(`\"/rackula-prod${ref}\"`);
            fs.writeFileSync(file, html);
          }
          NODE
          touch dist/.nojekyll

      - name: Build corrected mobile test
        working-directory: test
        env:
          VITE_ENV: production
          VITE_BASE_PATH: /rackula-prod/mobile-side-view-test/
        run: |
          npm ci
          npm run build

      - name: Adapt test static root references
        working-directory: test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const files = ['dist/index.html', 'dist/login.html'];
          const refs = ['/favicon.png', '/favicon-light.png', '/favicon.ico', '/apple-touch-icon.png', '/config.js'];
          const prefix = '/rackula-prod/mobile-side-view-test';
          for (const file of files) {
            let html = fs.readFileSync(file, 'utf8');
            for (const ref of refs) html = html.split(`\"${ref}\"`).join(`\"${prefix}${ref}\"`);
            fs.writeFileSync(file, html);
          }
          NODE
          touch dist/.nojekyll

      - name: Verify both artifact identities
        shell: bash
        env:
          PROD_SHORT: ${{ steps.prod_source.outputs.short }}
          TEST_SHORT: ${{ steps.test_source.outputs.short }}
        run: |
          set -euo pipefail
          grep -Fq "\"commit\": \"${PROD_SHORT}\"" prod/dist/version.json
          grep -Fq "\"commit\": \"${TEST_SHORT}\"" test/dist/version.json
          grep -Fq '/rackula-prod/config.js' prod/dist/index.html
          grep -Fq '/rackula-prod/mobile-side-view-test/config.js' test/dist/index.html
          grep -Eq 'storage:[[:space:]]*"browser"' prod/dist/config.js
          grep -Eq 'storage:[[:space:]]*"browser"' test/dist/config.js

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/mobile-side-view-test
          cp -a prod/dist/. site/
          cp -a test/dist/. site/mobile-side-view-test/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy production-preserving test site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify production root and mobile test
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HTTP smoke for production and test URLs
        shell: bash
        env:
          PROD_URL: https://bect75.github.io/rackula-prod/
          TEST_URL: https://bect75.github.io/rackula-prod/mobile-side-view-test/
          PROD_SHORT: ${{ needs.build.outputs.prod_short }}
          TEST_SHORT: ${{ needs.build.outputs.test_short }}
        run: |
          set -euo pipefail
          retry_curl() {
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "$1"
          }
          prod_version="$(retry_curl "${PROD_URL}version.json")"
          test_version="$(retry_curl "${TEST_URL}version.json")"
          prod_html="$(retry_curl "$PROD_URL")"
          test_html="$(retry_curl "$TEST_URL")"
          printf '%s' "$prod_html" | grep -Fq 'Rackula - Rack Layout Designer'
          printf '%s' "$test_html" | grep -Fq 'Rackula - Rack Layout Designer'
          printf '%s' "$prod_version" | grep -Fq "\"commit\": \"${PROD_SHORT}\""
          printf '%s' "$test_version" | grep -Fq "\"commit\": \"${TEST_SHORT}\""
          echo "Production preserved at ${PROD_SHORT}; mobile test published at ${TEST_SHORT}."
